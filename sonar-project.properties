sonar.projectKey=filacero-backend
sonar.projectName=FilaCero Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts,test/**/*.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/coverage-integration/**,**/coverage-e2e/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.integration-spec.ts,test/**,prisma/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info,coverage-e2e/lcov.info
